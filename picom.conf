# picom — tuned for infinite-canvas pans (many XMoveWindow per drag)
# backend xrender: safe on weak/GL-broken drivers; glx only if real HW GL works

shadow = false;

# fading on every map is fine; during canvas drag it adds compositor work
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 1.0;

corner-radius = 8;

backend = "xrender";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
# damage=true = only redraw changed regions (much smoother when panning the canvas)
use-damage = true;

rules: ({
  match = "class_g = 'Vxwm-decoration' || name = 'VXWM Window Pin'";
  opacity = 1.0;
  blur-background = false;
  shadow = false;
  corner-radius = 0;
}, {
  match = "name *= 'VXWM' && (name *= 'Edge Bar' || name *= 'Edge Corner' || name *= 'Corner Connector')";
  corner-radius = 0;
  shadow = false;
}, {
  match = "name *= 'VXWM Corner Connector'";
  opacity = 1.0;
  blur-background = false;
  shadow = false;
  corner-radius = 0;
}, {
  match = "name = 'VXWM Application Launcher'";
  opacity = 1.0;
  blur-background = false;
  shadow = false;
  corner-radius = 0;
}, {
  match = "name = 'VXWM Desktop Clock'";
  opacity = 1.0;
  blur-background = false;
  shadow = false;
  corner-radius = 0;
}, {
  match = "name = 'VXWM Media OSD'";
  blur-background = false;
  shadow = false;
  corner-radius = 0;
}, {
  match = "name = 'VXWM Notification Container'";
  blur-background = false;
  shadow = false;
  corner-radius = 0;
}, {
  match = "class_g = 'vxwm-power-menu' || class_i = 'vxwm-power-menu' || name = 'Power'";
  blur-background = false;
  shadow = false;
  corner-radius = 0;
}, {
  match = "name = 'Apps'";
  shadow = false;
  corner-radius = 0;
}, {
  match = "class_g = 'vxwm'";
  corner-radius = 4;
}, {
  match = "class_g = 'Rofi' || class_g = 'rofi' || (window_type = 'dock' && class_g != 'stalonetray') || name = 'VXWM App Launcher' || name = 'VXWM Power Menu' || window_type = 'tooltip' || window_type = 'menu' || window_type = 'desktop' || window_type = 'popup_menu' || name = 'Dunst' || name = 'dmenu-above' || class_g = 'dmenu' || class_g = 'dmenu-above'";
  corner-radius = 0;
}, {
  match = "class_g = 'stalonetray'";
  corner-radius = 4;
}, {
  match = "class_i = 'tray-menu' || class_g = 'Tray-menu'";
  opacity = 1.0;
  blur-background = false;
  transparent-clipping = false;
  shadow = false;
  corner-radius = 0;
}, {
  match = "window_type = 'dock' || window_type = 'tooltip' || window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'combo' || window_type = 'utility' || name = 'Dunst' || name = 'dmenu-above' || class_g = 'stalonetray' || class_g = 'vxwm' || class_g = 'dmenu' || class_g = 'dmenu-above' || (class_g *= 'mascot' || class_g *= 'shime' || class_i *= 'mascot' || class_i *= 'shime' || name *= 'Shime' || name *= 'shime' || name *= 'Mascot' || name *= 'mascot')";
  shadow = false;
})
